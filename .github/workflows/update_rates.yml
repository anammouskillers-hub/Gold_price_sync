name: Auto Update Yemen Exchange Rates

on:
  # 1. التشغيل التلقائي كل 30 دقيقة
  schedule:
    - cron: '*/30 * * * *'
    
  # 2. إمكانية تشغيل السكريبت يدويًا للتحقق والتجربة من GitHub
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      # جلب كود المشروع من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # تثبيت المكتبات المطلوبة (requests و firebase-admin)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      # تشغيل سكريبت بايثون وتمرير المفاتيح البيئية له
      - name: Run script to update Firebase
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python main.py # استبدل main.py باسم ملف البايثون لديك إذا كان مختلفاً
        
